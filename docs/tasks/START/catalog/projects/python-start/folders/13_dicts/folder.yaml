id: 13_dicts
code: DI
name: "Словари"
description: "Словарь: ключ и значение, get и in, цикл по items. Четыре роли словаря (запись, счётчик, группировщик, индекс), вложенные данные, копии словарей (b = a и неглубокая копия) и сортировка. Мост к продуктовым задачам: сообщения чата, журнал квестов, память помощника."
order: 13
level: medium
