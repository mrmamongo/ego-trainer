# docker-compose for ego-server — local dev + production.
#
# Usage:
#   docker-compose up -d        # start server in background
#   docker-compose logs -f      # view logs
#   docker-compose down         # stop
#   docker-compose down -v      # stop + wipe DB
#
# Server: http://localhost:8000
# Docs:   http://localhost:8000/docs (Swagger UI)
# Health: http://localhost:8000/health
#
# The server reads docs/tasks/ from the repo. In dev mode, docs/tasks/
# is mounted as a volume — edit tasks and restart to pick up changes.
# To re-import tasks without restart:
#   docker-compose exec ego-server ego-server admin import-tasks --docs-dir docs/tasks

services:
  ego-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database across container restarts.
      - ego-data:/app/.ego-server
      # Mount docs/tasks/ for live task updates (no rebuild needed).
      - ./docs/tasks:/app/docs/tasks:ro
    environment:
      - EGO_DB_PATH=/app/.ego-server/ego.db
      - EGO_JWT_SECRET=${EGO_JWT_SECRET:-dev-secret-change-in-production}
      # CORS: allow all origins for dev (VSCode extension, browser, etc).
      # For production, set to specific origins: ["https://your-domain.com"]
      - EGO_CORS_ORIGINS=["*"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  ego-data:
    driver: local
