# Reproducible production candidate for ego-server.
#
# Usage:
#   docker-compose up -d        # start server in background
#   docker-compose logs -f      # view logs
#   docker-compose down         # stop
#   docker-compose down -v      # stop + wipe DB
#
# Admin:  http://localhost:${EGO_PORT:-8000}/
# Docs:   http://localhost:8000/docs (Swagger UI)
# Health: http://localhost:8000/health
#
# Canonical content is an explicit read-write mount because Task Studio edits
# it. Set EGO_CONTENT_PATH to a disposable checkout/copy for local evaluation.

services:
  ego-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${EGO_BIND_ADDRESS:-127.0.0.1}:${EGO_PORT:-8000}:8000"
    volumes:
      # Persist SQLite database across container restarts.
      - ego-data:/var/lib/ego
      - ${EGO_CONTENT_PATH:-./docs/tasks}:/content
    env_file:
      - path: .env
        required: false
    environment:
      EGO_ENVIRONMENT: production
      EGO_DB_PATH: /var/lib/ego/ego.db
      EGO_TASKS_REPO_URL: /content
      EGO_JWT_SECRET: ${EGO_JWT_SECRET:?Set EGO_JWT_SECRET to at least 32 random characters}
      # Same-origin Admin UI and the VS Code extension need no browser CORS.
      # Set an explicit JSON list only when a separate browser origin is used.
      EGO_CORS_ORIGINS: ${EGO_CORS_ORIGINS:-[]}
      EGO_ALLOWED_HOSTS: ${EGO_ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
      EGO_UVICORN_WORKERS: ${EGO_UVICORN_WORKERS:-1}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  ego-data:
    driver: local
