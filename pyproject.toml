[project]
name = "ego-trainer"
version = "0.1.0"
description = "Ego — platform for practice tasks with auto-checking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ego = "ego.cli.main:main"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "pydantic-settings>=2"]
tui = ["textual>=0.50", "rich>=13.7"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ego", "ego_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
