[project]
name = "ego-trainer"
version = "0.1.0"
description = "Ego — platform for practice tasks with auto-checking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
ego = "ego.cli.main:main"
ego-server = "ego_server.cli:main"
ego-tui = "ego_tui.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "pydantic-settings>=2", "pyjwt>=2.8", "passlib[bcrypt]>=1.7", "bcrypt<5.0", "httpx>=0.27", "cryptography>=43"]
tui = ["textual>=0.50", "rich>=13.7"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3", "httpx>=0.27"]
mcp = ["fastmcp==3.4.7"]
collab = [
    "ypy-websocket==0.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ego", "ego_server", "ego_tui"]
# Web shells and their assets are served straight from ego_server/static/.
# admin/ is produced by admin-ui/build.mjs (committed; the Docker web stage
# rebuilds it), so the wheel always carries /panel and /ide in working order.
artifacts = ["ego_server/static/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/ego",
    "/ego_server",
    "/ego_tui",
    "/admin-ui",
    "/scripts",
    "/Dockerfile",
    "/README.md",
    "/pyproject.toml",
]
exclude = ["**/node_modules", "**/.build-check"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Embedded verbatim into the `python -S` wrapper; `sys`, `importlib` and
# `_print_traceback` come from the wrapper's globals, not from imports.
"ego/exec_helpers.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
